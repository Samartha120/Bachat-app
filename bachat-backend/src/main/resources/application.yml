    # 256-bit secret key for HMAC-SHA256 signature
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  company:
    name: "Shrestha Services"
    system: "Bachat Core Financial Engine"
    payment-info:
      bank-name: "Nabil Bank Limited"
      account-number: "01001017500124"
      account-name: "Shrestha Services Pvt. Ltd."
      esewa-id: "9841234567"
      khalti-id: "9841234567"

logging:
